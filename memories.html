
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我们的回忆</title>
  <style>
    
    
    * {
    box-sizing: border-box;
    }

    html {
    min-height: 100%;
    scroll-behavior: smooth;
    background: #EAE2D8;
    }

    body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    background: #EAE2D8;
    color: #594638;
    font-family: "PingFang SC", "Hiragino Sans GB",
        "Microsoft YaHei", sans-serif;
    }

    .phone {
    position: relative;
    width: 100%;
    max-width: 430px;
    min-height: 100vh;
    min-height: 100dvh;
    margin: 0 auto;
    padding: 36px 0 40px;
    overflow: hidden;
    background: #FFFDF8;
    box-shadow: 0 0 25px rgba(80, 55, 35, 0.08);
    }


  .sticky-header {
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 14px 16px;
    background: rgba(255, 253, 248, 0.96);
    border-bottom: 1px solid rgba(197, 164, 109, 0.25);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }

  .header-title {
    min-width: 0;
  }

  .header-title h1 {
    margin: 0 0 5px;
    color: #9F8052;
    font-size: 21px;
    font-weight: 500;
  }

  .header-title p {
    margin: 0;
    color: #92785E;
    font-size: 11px;
    line-height: 1.5;
  }

  .sticky-header .back-button {
    flex-shrink: 0;
    margin-top: 0;
    padding: 10px 14px;
    font-size: 12px;
    white-space: nowrap;
  }

    

    /* The visible window stays within the phone width */
    
    .film-viewport {
    width: 100%;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-x;
    scrollbar-width: none;
    }


    .film-viewport::-webkit-scrollbar {
    display: none;
    }

    .film-viewport:active {
    cursor: grabbing;
    }

    /* Film strip with classic perforations */
    .film-track {
    display: flex;
    width: max-content;
    gap: 16px;
    padding: 24px 16px;
    background-color: #594638;
    background-image:
        radial-gradient(circle, #FFFDF8 3px, transparent 3.5px),
        radial-gradient(circle, #FFFDF8 3px, transparent 3.5px);
    background-size: 22px 14px, 22px 14px;
    background-position: 5px 4px, 5px calc(100% - 4px);
    background-repeat: repeat-x;
    }

    .film-set {
    display: flex;
    flex: 0 0 auto;
    gap: 16px;
    }

    /* White photo frames */
    .film-photo {
    flex: 0 0 172px;
    width: 172px;
    padding: 8px 8px 14px;
    background: #FFFDF8;
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.18);
    }

    .film-photo img {
    display: block;
    width: 100%;
    height: 218px;
    object-fit: cover;
    background: #EAE2D8;
    }

    .film-caption {
    padding-top: 9px;
    color: #795D45;
    font-size: 12px;
    line-height: 1.5;
    text-align: center;
    }

    /* Heading below the film strip */
    .memory-note {
    margin: 24px 20px 0;
    color: #92785E;
    font-size: 13px;
    line-height: 1.9;
    text-align: center;
    }

    .back-area {
    padding: 0 20px;
    text-align: center;
    }

    .back-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 28px;
    padding: 12px 24px;
    border-radius: 30px;
    background: #B99A68;
    color: #FFFFFF;
    text-decoration: none;
    font-size: 14px;
    transition: background 0.3s ease;
    }

    .back-button:hover {
    background: #9F8052;
    }

    @media (max-width: 360px) {
    .film-photo {
        flex-basis: 150px;
        width: 150px;
    }

    .film-photo img {
        height: 195px;
    }
    }



    /* Alternating memory sections */
    .memory-section {
      padding: 32px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .memory-section:nth-of-type(odd) {
      background: #FFF7E9;
    }

    .memory-section:nth-of-type(even) {
      background: #E9DED0;
    }

    .memory-section-label {
      margin: 0;
      color: #9F8052;
      font-size: 12px;
      letter-spacing: 3px;
      text-align: center;
    }

    .memory-section-title {
      margin: 0;
      color: #795D45;
      font-size: 20px;
      font-weight: 500;
      text-align: center;
    }

    
  /* 3D picture frame */
  .flip-frame {
      position: relative;
      display: block;
      width: 100%;
      max-width: 290px;
      height: auto;
      aspect-ratio: auto;
      padding: 0;
      border: 0;
      background: transparent;
      perspective: 1000px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      text-align: center;
  }

  .flip-frame-inner {
    position: relative;
    display: block;
    width: 100%;
    height: auto;
    transform-style: preserve-3d;
    -webkit-transform-style: preserve-3d;
    transition: transform 0.75s ease;
  }

  .flip-frame.is-flipped .flip-frame-inner {
      transform: rotateY(180deg);
  }

  .flip-frame-front,
  .flip-frame-back {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
      border: 1px solid #D8C5A7;
      border-radius: 4px;
      background: #FFFDF8;
      box-shadow: 0 8px 22px rgba(80, 55, 35, 0.12);
      overflow: hidden;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
  }

  .flip-frame-front {
      transform: rotateY(0deg);
  }

  .flip-frame-back {
      transform: rotateY(180deg);
      color: #795D45;
      overflow-y: auto;
  }


  .flip-frame-front img {
      display: block;
      width: 100%;
      height: auto;
      max-height: none;
      object-fit: contain;
      object-position: center;
  }


  .frame-caption {
      margin: 12px 0 0;
      color: #795D45;
      font-size: 14px;
      line-height: 1.5;
  }

  .frame-back-title {
      margin: 0 0 12px;
      color: #9F8052;
      font-size: 19px;
      font-weight: 500;
  }

  .frame-description {
      margin: 0;
      font-size: 13px;
      line-height: 1.9;
      white-space: normal;
  }

  .frame-hint {
      margin: 0;
      color: #92785E;
      font-size: 12px;
      text-align: center;
  }

  @media (prefers-reduced-motion: reduce) {
      .flip-frame-inner {
          transition: none;
      }
  }

    

  </style>
</head>


<body>
  <div class="phone">

    
    <header class="sticky-header">
      <div class="header-title">
        <h1>我们的回忆 ♡</h1>
        <p>Every picture tells a story...</p>
      </div>

      <a href="index.html#home" class="back-button">
        ← 返回
      </a>
    </header>


    <section class="film-viewport" id="filmViewport"
      aria-label="Jasmine 的回忆照片，可左右滑动">

      <div class="film-track" id="filmTrack">

        <div class="film-set" id="filmSet">

          <article class="film-photo">
            <img src="photos/image1-H.JPG"
              alt="Jasmine 回忆照片 1" draggable="false">
            <div class="film-caption">珍贵的时刻 ♡</div>
          </article>

          <article class="film-photo">
            <img src="photos/image2-H.JPG"
              alt="Jasmine 回忆照片 2" draggable="false">
            <div class="film-caption">美好的回忆</div>
          </article>

          <article class="film-photo">
            <img src="photos/image3-H.JPG"
              alt="Jasmine 回忆照片 3" draggable="false">
            <div class="film-caption">一起走过的日子</div>
          </article>

          <article class="film-photo">
            <img src="photos/image4-H.JPG"
              alt="Jasmine 回忆照片 4" draggable="false">
            <div class="film-caption">感恩每个瞬间</div>
          </article>

          <article class="film-photo">
            <img src="photos/image5-H.JPG"
              alt="Jasmine 回忆照片 5" draggable="false">
            <div class="film-caption">永远珍藏 ♡</div>
          </article>

        </div>
      </div>
    </section>

    <p class="memory-note">
      Little moments, precious memories.<br>
      愿每一份回忆，都成为心中温暖的礼物。
    </p>


    <!-- Memory 01: Background A -->
    <section class="memory-section">
      <p class="memory-section-label">MEMORY 01</p>
      <h2 class="memory-section-title">珍贵的时刻 ♡</h2>

      <button class="flip-frame" type="button"
        aria-label="翻转相框，查看珍贵的时刻"
        aria-pressed="false">
        <span class="flip-frame-inner">
          <span class="flip-frame-front">
            <img src="photos/image1-H.JPG"
              alt="珍贵的回忆" loading="lazy">
            <span class="frame-caption">珍贵的时刻 ♡</span>
          </span>

          <span class="flip-frame-back">
            <span class="frame-back-title">那些美好的日子</span>
            <span class="frame-description">
              谢谢你带来的温暖、笑容与陪伴。
              愿这些珍贵的时刻，成为我们心中永远的礼物。
            </span>
          </span>
        </span>
      </button>

      <p class="frame-hint">轻触相框，翻开这段回忆 ♡</p>
    </section>

    <!-- Memory 02: Background B -->
    <section class="memory-section">
      <p class="memory-section-label">MEMORY 02</p>
      <h2 class="memory-section-title">一起走过的日子</h2>

      <button class="flip-frame" type="button"
        aria-label="翻转相框，查看一起走过的日子"
        aria-pressed="false">
        <span class="flip-frame-inner">
          <span class="flip-frame-front">
            <img src="photos/image2-H.JPG"
              alt="一起走过的日子" loading="lazy">
            <span class="frame-caption">那些值得珍藏的瞬间</span>
          </span>

          <span class="flip-frame-back">
            <span class="frame-back-title">感恩有你</span>
            <span class="frame-description">
              每一段相遇都有意义，每一份付出都值得感谢。
              愿你未来的道路充满恩典与盼望。
            </span>
          </span>
        </span>
      </button>

      <p class="frame-hint">轻触相框，翻开这段回忆 ♡</p>
    </section>

    <!-- Memory 03: Background A -->
    <section class="memory-section">
      <p class="memory-section-label">MEMORY 03</p>
      <h2 class="memory-section-title">美好的新篇章</h2>

      <button class="flip-frame" type="button"
        aria-label="翻转相框，查看美好的新篇章"
        aria-pressed="false">
        <span class="flip-frame-inner">
          <span class="flip-frame-front">
            <img src="photos/image3-H.JPG"
              alt="美好的新篇章" loading="lazy">
            <span class="frame-caption">愿未来继续闪耀</span>
          </span>

          <span class="flip-frame-back">
            <span class="frame-back-title">愿主赐福于你</span>
            <span class="frame-description">
              愿主引领你前方的每一步，
              赐你平安、智慧与力量，
              让你在新的旅程中继续发光。
            </span>
          </span>
        </span>
      </button>

      <p class="frame-hint">轻触相框，翻开这段回忆 ♡</p>
    </section>

    

  </div>

  
  

<script>
  const viewport = document.getElementById("filmViewport");
  const track = document.getElementById("filmTrack");
  const originalSet = document.getElementById("filmSet");

  if (viewport && track && originalSet) {
    // Duplicate the photo strip for continuous scrolling.
    const clone = originalSet.cloneNode(true);
    clone.removeAttribute("id");
    clone.setAttribute("aria-hidden", "true");
    track.appendChild(clone);

    const speed = 30;
    let lastTime = 0;
    let distance = 0;
    let resumeTimer;

    function animate(time) {
      if (!lastTime) lastTime = time;

      const delta = Math.min((time - lastTime) / 1000, 0.05);
      lastTime = time;

      if (!document.hidden) {
        const loopWidth =
          originalSet.getBoundingClientRect().width + 16;

        if (loopWidth > 0) {
          distance += speed * delta;

          if (distance >= loopWidth) {
            distance -= loopWidth;
          }

          // Keep the animation and manual scrolling in sync.
          if (!resumeTimer) {
            viewport.scrollLeft = distance;
          }
        }
      }

      requestAnimationFrame(animate);
    }

    function pauseThenResume() {
      clearTimeout(resumeTimer);

      // Resume automatic scrolling after interaction.
      resumeTimer = setTimeout(() => {
        distance = viewport.scrollLeft;
        resumeTimer = null;
        lastTime = 0;
      }, 1800);
    }

    viewport.addEventListener("touchstart", pauseThenResume, {
      passive: true
    });

    viewport.addEventListener("touchend", pauseThenResume, {
      passive: true
    });

    viewport.addEventListener("touchcancel", pauseThenResume, {
      passive: true
    });

    viewport.addEventListener("pointerdown", pauseThenResume);
    window.addEventListener("pointerup", pauseThenResume);
    window.addEventListener("pointercancel", pauseThenResume);

    document.addEventListener("visibilitychange", () => {
      lastTime = 0;
    });

    requestAnimationFrame(animate);
  }

    // Flip memory frames when tapped or clicked.
    document.querySelectorAll(".flip-frame").forEach((frame) => {

      const img = frame.querySelector(".flip-frame-front img");

      function resizeFrame() {
          if (!img || !img.naturalWidth || !img.naturalHeight) return;

          const frameWidth = frame.clientWidth;
          const imageHeight = frameWidth * img.naturalHeight / img.naturalWidth;

          const caption = frame.querySelector(".frame-caption");
          const captionHeight = caption ? caption.offsetHeight + 12 : 0;

          frame.style.height = `${imageHeight + captionHeight + 24}px`;
          frame.querySelector(".flip-frame-inner").style.height = "100%";
      }

      if (img.complete) {
          resizeFrame();
      } else {
          img.addEventListener("load", resizeFrame);
      }

      window.addEventListener("resize", resizeFrame);
      frame.addEventListener("click", () => {
        const flipped = frame.classList.toggle("is-flipped");
        frame.setAttribute("aria-pressed", String(flipped));
      });
    });
  

</script>



</body>


</html>
