
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我们的回忆</title>
  <style>
    
    
    * {
    box-sizing: border-box;
    }

    html {
    min-height: 100%;
    scroll-behavior: smooth;
    background: #EAE2D8;
    }

    body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    background: #EAE2D8;
    color: #594638;
    font-family: "PingFang SC", "Hiragino Sans GB",
        "Microsoft YaHei", sans-serif;
    }

    .phone {
    position: relative;
    width: 100%;
    max-width: 430px;
    min-height: 100vh;
    min-height: 100dvh;
    margin: 0 auto;
    padding: 36px 0 40px;
    overflow: hidden;
    background: #FFFDF8;
    box-shadow: 0 0 25px rgba(80, 55, 35, 0.08);
    }

    .page-heading {
    padding: 0 20px;
    text-align: center;
    }

    .page-heading h1 {
    margin: 0 0 12px;
    color: #9F8052;
    font-size: 28px;
    font-weight: 500;
    }

    .page-heading p {
    margin: 0 0 30px;
    color: #92785E;
    font-size: 14px;
    line-height: 1.8;
    }

    /* The visible window stays within the phone width */
    
    .film-viewport {
    width: 100%;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-x;
    scrollbar-width: none;
    }


    .film-viewport::-webkit-scrollbar {
    display: none;
    }

    .film-viewport:active {
    cursor: grabbing;
    }

    /* Film strip with classic perforations */
    .film-track {
    display: flex;
    width: max-content;
    gap: 16px;
    padding: 24px 16px;
    background-color: #594638;
    background-image:
        radial-gradient(circle, #FFFDF8 3px, transparent 3.5px),
        radial-gradient(circle, #FFFDF8 3px, transparent 3.5px);
    background-size: 22px 14px, 22px 14px;
    background-position: 5px 4px, 5px calc(100% - 4px);
    background-repeat: repeat-x;
    }

    .film-set {
    display: flex;
    flex: 0 0 auto;
    gap: 16px;
    }

    /* White photo frames */
    .film-photo {
    flex: 0 0 172px;
    width: 172px;
    padding: 8px 8px 14px;
    background: #FFFDF8;
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.18);
    }

    .film-photo img {
    display: block;
    width: 100%;
    height: 218px;
    object-fit: cover;
    background: #EAE2D8;
    }

    .film-caption {
    padding-top: 9px;
    color: #795D45;
    font-size: 12px;
    line-height: 1.5;
    text-align: center;
    }

    /* Heading below the film strip */
    .memory-note {
    margin: 24px 20px 0;
    color: #92785E;
    font-size: 13px;
    line-height: 1.9;
    text-align: center;
    }

    .back-area {
    padding: 0 20px;
    text-align: center;
    }

    .back-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 28px;
    padding: 12px 24px;
    border-radius: 30px;
    background: #B99A68;
    color: #FFFFFF;
    text-decoration: none;
    font-size: 14px;
    transition: background 0.3s ease;
    }

    .back-button:hover {
    background: #9F8052;
    }

    @media (max-width: 360px) {
    .film-photo {
        flex-basis: 150px;
        width: 150px;
    }

    .film-photo img {
        height: 195px;
    }
    }


  </style>
</head>


<body>
  <div class="phone">

    <header class="page-heading">
      <h1>我们的回忆 ♡</h1>
      <p>Every picture tells a story...</p>
    </header>

    <section class="film-viewport" id="filmViewport"
      aria-label="Jasmine 的回忆照片，可左右滑动">

      <div class="film-track" id="filmTrack">

        <div class="film-set" id="filmSet">

          <article class="film-photo">
            <img src="photos/image1-H.JPG"
              alt="Jasmine 回忆照片 1" draggable="false">
            <div class="film-caption">珍贵的时刻 ♡</div>
          </article>

          <article class="film-photo">
            <img src="photos/image2-H.JPG"
              alt="Jasmine 回忆照片 2" draggable="false">
            <div class="film-caption">美好的回忆</div>
          </article>

          <article class="film-photo">
            <img src="photos/image3-H.JPG"
              alt="Jasmine 回忆照片 3" draggable="false">
            <div class="film-caption">一起走过的日子</div>
          </article>

          <article class="film-photo">
            <img src="photos/image4-H.JPG"
              alt="Jasmine 回忆照片 4" draggable="false">
            <div class="film-caption">感恩每个瞬间</div>
          </article>

          <article class="film-photo">
            <img src="photos/image5-H.JPG"
              alt="Jasmine 回忆照片 5" draggable="false">
            <div class="film-caption">永远珍藏 ♡</div>
          </article>

        </div>
      </div>
    </section>

    <p class="memory-note">
      Little moments, precious memories.<br>
      愿每一份回忆，都成为心中温暖的礼物。
    </p>

    <div class="back-area">
      <a href="index.html#home" class="back-button">
        ← 返回主页
      </a>
    </div>

  </div>

  <script>
    
    const viewport = document.getElementById("filmViewport");
    const track = document.getElementById("filmTrack");
    const originalSet = document.getElementById("filmSet");

    if (viewport && track && originalSet) {
    // Duplicate the original photos for a seamless loop.
    let secondSet = track.querySelector(".film-set-clone");

    if (!secondSet) {
        secondSet = originalSet.cloneNode(true);
        secondSet.removeAttribute("id");
        secondSet.classList.add("film-set-clone");
        secondSet.setAttribute("aria-hidden", "true");
        track.appendChild(secondSet);
    }

    const speed = 22; // Pixels per second
    let lastTime = 0;
    let interacting = false;
    let resumeTimer;
    let animationFrame;

    function animate(time) {
        if (!lastTime) lastTime = time;

        const delta = Math.min((time - lastTime) / 1000, 0.05);
        lastTime = time;

        if (!interacting && !document.hidden) {
        const loopWidth = originalSet.getBoundingClientRect().width;

        if (loopWidth > 0) {
            viewport.scrollLeft += speed * delta;

            if (viewport.scrollLeft >= loopWidth) {
            viewport.scrollLeft -= loopWidth;
            }
        }
        }

        animationFrame = requestAnimationFrame(animate);
    }

    function pauseForInteraction() {
        interacting = true;
        clearTimeout(resumeTimer);
    }

    function resumeAfterInteraction() {
        clearTimeout(resumeTimer);

        resumeTimer = setTimeout(() => {
        interacting = false;
        lastTime = 0;
        }, 1800);
    }

    viewport.addEventListener("touchstart", pauseForInteraction, {
        passive: true
    });

    viewport.addEventListener("touchend", resumeAfterInteraction, {
        passive: true
    });

    viewport.addEventListener("touchcancel", resumeAfterInteraction, {
        passive: true
    });

    viewport.addEventListener("pointerdown", pauseForInteraction);

    window.addEventListener("pointerup", resumeAfterInteraction);
    window.addEventListener("pointercancel", resumeAfterInteraction);

    document.addEventListener("visibilitychange", () => {
        lastTime = 0;
    });

    // Start only once.
    cancelAnimationFrame(animationFrame);
    animationFrame = requestAnimationFrame(animate);
    }

  </script>
</body>


</html>
